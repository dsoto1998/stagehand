[package]
name = "stagehand"
version = "0.1.0"
description = "Stagehand — Musician Rehearsal Tool"
authors = ["David"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stagehand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
cc = "1"

[dependencies]
tauri            = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
log              = "0.4"
parking_lot      = "0.12"

# Audio stack
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
cpal  = { version = "0.15", features = ["asio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
