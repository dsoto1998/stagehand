[package]
name = "stagehand"
version = "1.2.0"
description = "Stagehand — Musician Rehearsal Tool"
authors = ["David"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stagehand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
cc = "1"

[dependencies]
tauri            = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
log              = "0.4"
parking_lot      = "0.12"

# Audio stack
rodio      = { version = "0.19", default-features = false, features = ["symphonia-all"] }
symphonia  = { version = "0.5", default-features = false, features = ["all-codecs", "all-formats"] }
cpal  = { version = "0.15", features = ["asio"] }
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time"] }
open = "5"
rfd  = { version = "0.14", default-features = false, features = ["tokio"] }
vst3     = "0.3.0"
base64   = "0.22"
ringbuf  = "0.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Optimize all dependencies at O3 even in dev builds.
# Keeps our own code debuggable; makes symphonia/rodio/rubberband decode ~20x faster.
[profile.dev.package."*"]
opt-level = 3
