name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile "$env:RUNNER_TEMP\asiosdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\asiosdk.zip" -DestinationPath "$env:RUNNER_TEMP\asio"
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio\asiosdk_2.3.3_2019-06-14" >> $env:GITHUB_ENV
          $llvm_bin = (Get-Command clang -ErrorAction Stop).Source | Split-Path -Parent
          echo "LIBCLANG_PATH=$llvm_bin" >> $env:GITHUB_ENV

      - name: Install frontend deps
        run: npm install

      # ─── Analysis sidecar: beat detection + guitar removal (PyInstaller) ─────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Build analysis sidecar (beat detection + guitar removal)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            $exe, $rest = $args
            & $exe @rest
            if ($LASTEXITCODE -ne 0) { throw "command failed ($LASTEXITCODE): $exe $rest" }
          }

          Invoke-Checked python -m pip install --upgrade pip
          # CPU-only torch + torchaudio (the CUDA build is ~2.5GB). Installed from
          # the CPU index together so pip resolves a matching torch/torchaudio pair
          # before beat_this's git dependency can drag in a mismatched one.
          # PINNED: the in-app GPU pack (src-tauri/src/gpu_pack.rs) swaps in the
          # torch==2.11.0+cu130 wheel at runtime — keep these versions in lockstep.
          Invoke-Checked pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          # numpy + Cython must exist before madmom's setup.py runs
          Invoke-Checked pip install "numpy<1.24" "Cython<3"
          Invoke-Checked pip install -r sidecar/requirements.txt
          Invoke-Checked pip install pyinstaller

          # beat_detect.spec bundles the Beat This! checkpoint into the frozen
          # build (it must run offline). Fetch it into the torch hub cache first
          # so the spec finds it instead of raising.
          Invoke-Checked python -c "from beat_this.inference import File2Beats; File2Beats(device='cpu')"
          # Same for the guitar-removal model (htdemucs_6s, bundled by the spec).
          Invoke-Checked python -c "from demucs.pretrained import get_model; get_model('htdemucs_6s')"

          Invoke-Checked pyinstaller sidecar/beat_detect.spec --noconfirm --distpath sidecar/dist --workpath sidecar/build
          New-Item -ItemType Directory -Force src-tauri/binaries/beat_detect | Out-Null
          Copy-Item -Recurse -Force sidecar/dist/beat_detect/* src-tauri/binaries/beat_detect/
          foreach ($exe in 'beat_detect.exe', 'stem_separate.exe') {
            if (-not (Test-Path "src-tauri/binaries/beat_detect/$exe")) {
              throw "sidecar build did not produce $exe"
            }
          }
          # A successful freeze proves nothing (see beat_detect.spec) — make sure
          # the stem separator actually imports torch + demucs.
          Invoke-Checked src-tauri/binaries/beat_detect/stem_separate.exe --probe

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stagehand ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            See the release notes below.
