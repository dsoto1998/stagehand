name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile "$env:RUNNER_TEMP\asiosdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\asiosdk.zip" -DestinationPath "$env:RUNNER_TEMP\asio"
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio\asiosdk_2.3.3_2019-06-14" >> $env:GITHUB_ENV
          $llvm_bin = (Get-Command clang -ErrorAction Stop).Source | Split-Path -Parent
          echo "LIBCLANG_PATH=$llvm_bin" >> $env:GITHUB_ENV

      - name: Install frontend deps
        run: npm install

      - name: Build
        run: npm run tauri:build

      - name: Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stagehand ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          skipBuild: true
