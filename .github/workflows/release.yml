name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile "$env:RUNNER_TEMP\asiosdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\asiosdk.zip" -DestinationPath "$env:RUNNER_TEMP\asio"
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio\asiosdk_2.3.3_2019-06-14" >> $env:GITHUB_ENV
          $llvm_bin = (Get-Command clang -ErrorAction Stop).Source | Split-Path -Parent
          echo "LIBCLANG_PATH=$llvm_bin" >> $env:GITHUB_ENV

      - name: Install frontend deps
        run: npm install

      # ─── Beat-detection sidecar (BeatNet, frozen with PyInstaller) ───────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Build beat-detection sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (the CUDA build is ~2.5GB)
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # numpy + Cython must exist before madmom's setup.py runs
          pip install "numpy<1.24" "Cython<3"
          pip install -r sidecar/requirements.txt
          pip install pyinstaller
          pyinstaller sidecar/beat_detect.spec --noconfirm --distpath sidecar/dist --workpath sidecar/build
          New-Item -ItemType Directory -Force src-tauri/binaries/beat_detect | Out-Null
          Copy-Item -Recurse -Force sidecar/dist/beat_detect/* src-tauri/binaries/beat_detect/
          if (-not (Test-Path src-tauri/binaries/beat_detect/beat_detect.exe)) {
            throw "sidecar build did not produce beat_detect.exe"
          }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stagehand ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## What's new in v1.1.0

            ### Cent fine-tune
            Each track now has a ±50¢ fine-tune control alongside the semitone slider — useful for tracks that are slightly off-pitch without needing a full semitone shift. Click the cent value to open the popover in both the track card and the miniplayer. Hold the ±1¢ buttons for accelerating repeat.
