name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── JavaScript unit tests (Ubuntu, no native deps needed) ─────────────────
  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

  # ── Sidecar pure-Python tests (no torch/librosa/madmom) ──────────────────
  sidecar-tests:
    name: Sidecar unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dev deps (numpy + pytest only)
        run: pip install -r sidecar/requirements-dev.txt

      - name: Run sidecar tests
        run: python -m pytest sidecar/tests -q

  # ── Rust unit tests (Windows, required for ASIO + GTK deps) ───────────────
  rust-tests:
    name: Rust unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" `
            -OutFile "$env:TEMP\asiosdk.zip"
          Expand-Archive -Path "$env:TEMP\asiosdk.zip" -DestinationPath "$env:TEMP\asiosdk"
          $sdkDir = (Get-ChildItem "$env:TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          echo "CPAL_ASIO_DIR=$sdkDir" >> $env:GITHUB_ENV

      - name: Run Rust unit tests
        working-directory: src-tauri
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo test --lib
